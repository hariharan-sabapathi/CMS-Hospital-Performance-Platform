name: "cms_platform"
version: "1.0.0"
config-version: 2

profile: "cms_platform"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Bronze CSVs are the output of src/cms_platform/ingest/loader.py, always
  # relative to this dbt project directory. Override with --vars for other
  # layouts.
  bronze_dir: "../data/bronze"
  # Modeling assumption for the synthetic dollar-impact field — see
  # models/marts/fact_hvbp_performance.sql and the README data limitations
  # section. Not a CMS-published figure.
  assumed_base_medicare_revenue: 10000000

models:
  cms_platform:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  cms_platform:
    +schema: seeds
