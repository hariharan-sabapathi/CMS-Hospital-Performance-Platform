[project]
name = "cms-platform"
version = "1.0.0"
description = "CMS Hospital Performance Platform — HVBP financial impact and ED throughput, merged into one dbt-modeled star schema behind a read API."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
]

[project.optional-dependencies]
spark = [
    "pyspark==4.1.2",
    "dbt-snowflake==1.11.*",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16",
    "scipy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
